stages:
  - build

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/gradle_global_cache"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"

cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - gradle_global_cache/wrapper
    - gradle_global_cache/caches
    - jdk21/

build_job:
  stage: build
  image: mobiledevops/android-sdk-image:34.0.1

  before_script:
    - |
      if [ ! -d "$CI_PROJECT_DIR/jdk21" ]; then
        echo "Downloading Java 21 (Fresh Start)..."
        curl -L https://download.oracle.com/java/21/latest/jdk-21_linux-x64_bin.tar.gz -o jdk21.tar.gz
        tar -xzf jdk21.tar.gz
        rm jdk21.tar.gz
        
        EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "jdk-21*" | head -n 1)
        mv "$EXTRACTED_DIR" jdk21
      else
        echo "Using Cached Java 21"
      fi
    
    - export JAVA_HOME="$CI_PROJECT_DIR/jdk21"
    - export PATH="$JAVA_HOME/bin:$PATH"
    - chmod +x gradlew

  script:
    - |
      if [ -f "buildSrc/src/main/kotlin/Version.kt" ]; then
        MAJOR=$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionMajor = \K\d+' | head -1 || echo "1")
        MINOR=$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionMinor = \K\d+' | head -1 || echo "0")
        PATCH=$(grep -A 1 'val currentVersion: Version =' buildSrc/src/main/kotlin/Version.kt | grep -oP 'versionPatch = \K\d+' | head -1 || echo "0")
        VERSION="${MAJOR:-1}.${MINOR:-0}.${PATCH:-0}"
      else
        VERSION="1.0.0"
      fi
      echo "Building Version: $VERSION"

    # بناء سريع بدون توقيع وبدون فحوصات Lint المعيقة
    - bash ./gradlew assembleRelease --parallel --build-cache --no-daemon -x lint -x lintVitalRelease -x test

    - mkdir -p release_output
    - echo "Searching for APKs..."
    - find app/build/outputs -name "*.apk"
    - find app/build/outputs -name "*.apk" -exec cp {} release_output/ \;
    - ls -l release_output/

  artifacts:
    name: "SealPlus-$CI_COMMIT_SHORT_SHA"
    paths:
      - release_output/*.apk
    expire_in: 1 week
    access: all
